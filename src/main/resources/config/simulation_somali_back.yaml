# ======================================================================
# Simulation configuration for Anopheles stephensi in Somali
# 2‑MONTH SIMULATION (April – May 2020) – adjusted for actual raster ranges
# ======================================================================

time:
  startDateTime: "2020-04-01T00:00:00"
  totalTicks: 17280        
  tickMinutes: 15

files:
  studySite: "prepared_data/somali/somali.shp"
  elevation: "prepared_data/somali/Small_Somali_Elevation_10m.tif"
  buildings: "prepared_data/somali/Small_Somali_Building_Density_10m.tif"
  population: "prepared_data/somali/Small_Somali_Population_10m.tif"
  climateNetCDF: "prepared_data/somali/climate_t2m_tp_2020.nc"

gridCellSizeDegrees: 0.001

# ======================================================================
# Species parameters – tuned for Anopheles stephensi (unchanged)
# ======================================================================
species:
  fecundity_a: 0.378
  fecundity_b: 0.173
  fecundity_Tmax: 40.0
  fecundity_c: 2.97

  egg_dev_a: -0.0009
  egg_dev_b: 0.048
  egg_dev_c: -0.345

  larva_dev_a: -0.0006
  larva_dev_b: 0.034
  larva_dev_c: -0.28

  pupa_dev_a: -0.0008
  pupa_dev_b: 0.045
  pupa_dev_c: -0.38

  egg_survival_amp: 0.92
  egg_survival_mean: 25.0
  egg_survival_sigma: 5.0

  larva_survival_amp: 0.85
  larva_survival_mean: 25.0
  larva_survival_sigma: 5.0

  pupa_survival_amp: 0.90
  pupa_survival_mean: 25.0
  pupa_survival_sigma: 5.0

  adult_mort_a: 0.00015
  adult_mort_b: -0.0025
  adult_mort_c: 0.10

# ======================================================================
# Tokens – environmental layers
# ======================================================================
tokens:
  - token: "temperature"
    layer: "t2m"
  - token: "precipitation"
    layer: "tp"
  - token: "population"
    layer: "Population"
  - token: "building_density"
    layer: "Buildings"
  - token: "elevation"
    layer: "Elevation"

# ======================================================================
# Agent rules (unchanged)
# ======================================================================
agentLayers:
  - name: "Mosquitoes"
    rules:
      - condition: "stage == 'LARVA' && age > 960"          # >10 days (emergency)
        action: "pupate"
        priority: 10
      - condition: "stage == 'PUPA' && age > 384"           # >4 days (emergency)
        action: "emerge"
        priority: 10
      - condition: "stage == 'ADULT' && energy < 0.7"
        action: "feed"
        priority: 5
      - condition: "stage == 'ADULT' && energy > 0.2"
        action: "get_gravid"
        priority: 7
      - condition: "gravid == true && temperature > 285.15"
        action: "lay_eggs"
        priority: 6
      - condition: "temperature < 283.15 || temperature > 313.15"
        action: "die"
        priority: 9
      - condition: "stage == 'ADULT' && precipitation > 0.005 && building_density > 0.1 && !resting"
        action: "rest_in_building"
        priority: 4
      - condition: "stage == 'ADULT' && energy < 0.8"
        action: "feed"
        priority: 3
      - condition: "stage == 'ADULT' && !resting"
        action: "move_random"
        priority: 2
      - condition: "true"
        action: "rest"
        priority: 1

  - name: "WaterTanks"
    rules:
      - condition: "waterVolume <= 5 && waterVolume > 0"
        action: "dry_out"
        priority: 3
      - condition: "temperature < 273.15 && waterVolume > 0"
        action: "freeze"
        priority: 2
      - condition: "temperature > 285.15 && precipitation < 0.005"
        action: "evaporate"
        priority: 5
      - condition: "waterVolume == 0 && eggCount == 0 && larvalCount == 0"
        action: "die"
        priority: 4

# ======================================================================
# Seeding – thresholds lowered to match actual raster values:
#   building: max 6, mean 0.0007 → threshold 0.02 (safe)
#   population: max 0.189, mean ~0 → threshold 0.001
#   Ensure valid pixels cover ~25‑48% of area.
# ======================================================================
seeding:
  seedAcrossFullStudySite: true
  tanksToSeed: 5000
  mosquitoesToSeed: 20000
  habitatGridSizeX: 50
  habitatGridSizeY: 50
  tankBuildingThreshold: 0.0      
  tankPopulationThreshold: 0.0
  mosquitoBuildingThreshold: 0.0
  mosquitoPopulationThreshold: 0.0

# ======================================================================
# Project defaults
# ======================================================================
project:
  defaultAgentSearchRadius: 0.0005    # ~55 m
  defaultAgentStep: 0.00005           # ~5.5 m per tick
  defaultMaxAgentAge: 1920            # 20 days * 96 ticks/day