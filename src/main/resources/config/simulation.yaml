# ======================================================================
# Simulation configuration for Anopheles stephensi – REALISTIC CALIBRATION
# Based on meta-analyses of temperature-dependent traits.
# Reference: Mordecai et al. (2013) Parasites & Vectors
# ======================================================================

time:
  startDateTime: "2020-04-01T00:00:00"
  totalTicks: 17280         
  tickMinutes: 15

files:
  studySite: "prepared_data/somali/somali.shp"
  elevation: "prepared_data/somali/Small_Somali_Elevation_10m.tif"
  buildings: "prepared_data/somali/Small_Somali_Building_Density_10m.tif"
  population: "prepared_data/somali/population_2020_1km.tif"
  climateNetCDF: "prepared_data/somali/climate_t2m_tp_2020.nc"

gridCellSizeDegrees: 0.001

# ======================================================================
# Species parameters – Anopheles stephensi (temperature-dependent)
# Quadratic functions: rate = a*T^2 + b*T + c (T in Celsius)
# From Mordecai et al. 2013 (supplement)
# ======================================================================
species:
  # Fecundity: eggs/female/day (temperature-dependent, peaked at ~28°C)
  fecundity_a: -0.0099
  fecundity_b: 0.567
  fecundity_Tmax: 32.0
  fecundity_c: 2.97

  # Egg development rate (1/days)
  egg_dev_a: -0.00098
  egg_dev_b: 0.0502
  egg_dev_c: -0.348

  # Larva development rate (1/days) – corrected shape
  larva_dev_a: -0.00082
  larva_dev_b: 0.0425
  larva_dev_c: -0.305

  # Pupa development rate (1/days)
  pupa_dev_a: -0.00074
  pupa_dev_b: 0.0398
  pupa_dev_c: -0.291

  # Egg survival (Gaussian)
  egg_survival_amp: 0.94
  egg_survival_mean: 26.2      # Optimal temperature for egg survival
  egg_survival_sigma: 3.5

  # Larva survival (Gaussian)
  larva_survival_amp: 0.88
  larva_survival_mean: 26.8    # Larvae tolerate slightly higher optima
  larva_survival_sigma: 3.8

  # Pupa survival (Gaussian)
  pupa_survival_amp: 0.91
  pupa_survival_mean: 26.5
  pupa_survival_sigma: 3.6

  # Adult mortality (1/day) – quadratic increasing with temperature
  adult_mort_a: 0.00012
  adult_mort_b: -0.0018
  adult_mort_c: 0.055

# ======================================================================
# Tokens – environmental layers (unchanged)
# ======================================================================
tokens:
  - token: "temperature"
    layer: "t2m"
  - token: "precipitation"
    layer: "tp"
  - token: "population"
    layer: "Population"
  - token: "building_density"
    layer: "Buildings"
  - token: "elevation"
    layer: "Elevation"

# ======================================================================
# Agent rules – refined with physiological realism
# ======================================================================
agentLayers:
  - name: "Mosquitoes"
    rules:
      # Emergency transitions (if development extremely delayed)
      - condition: "stage == 'LARVA' && age > 960"
        action: "pupate"
        priority: 10
      - condition: "stage == 'PUPA' && age > 384"
        action: "emerge"
        priority: 10
      # Feeding and resting cycle
      - condition: "stage == 'ADULT' && energy < 0.6 && !resting"
        action: "feed"
        priority: 8
      - condition: "stage == 'ADULT' && energy < 0.9 && resting"
        action: "rest"
        priority: 6
      # Gonotrophic cycle – only when energy sufficient
      - condition: "stage == 'ADULT' && energy > 0.7 && !gravid"
        action: "get_gravid"
        priority: 7
      - condition: "gravid == true && temperature > 288.15"  # >15°C
        action: "lay_eggs"
        priority: 6
      # Temperature extremes
      - condition: "temperature < 283.15 || temperature > 313.15"
        action: "die"
        priority: 9
      # Seek shelter if heavy rain or low temperature
      - condition: "(precipitation > 0.008 || temperature < 287.15) && building_density > 0.1 && !resting"
        action: "rest_in_building"
        priority: 5
      # Default movement
      - condition: "stage == 'ADULT' && !resting"
        action: "move_random"
        priority: 3
      - condition: "true"
        action: "rest"
        priority: 2

  - name: "WaterTanks"
    rules:
      - condition: "waterVolume <= 5 && waterVolume > 0"
        action: "dry_out"
        priority: 3
      - condition: "temperature < 273.15 && waterVolume > 0"
        action: "freeze"
        priority: 2
      - condition: "temperature > 288.15 && precipitation < 0.002"
        action: "evaporate"
        priority: 5
      - condition: "waterVolume == 0 && eggCount == 0 && larvalCount == 0"
        action: "die"
        priority: 4

# ======================================================================
# Seeding – habitat-weighted (critical for spatial validity)
# ======================================================================
seeding:
  seedAcrossFullStudySite: False       # Use habitat suitability weighting
  tanksToSeed: 50000
  mosquitoesToSeed: 250000
  habitatGridSizeX: 500               
  habitatGridSizeY: 500
  # Low thresholds to include many cells, weighting will select most suitable
  tankBuildingThreshold: 0.0
  tankPopulationThreshold: 0.0
  mosquitoBuildingThreshold: 0.0
  mosquitoPopulationThreshold: 0.0

# ======================================================================
# Project defaults
# ======================================================================
project:
  defaultAgentSearchRadius: 0.005    # ~550 m
  defaultAgentStep: 0.00005           # ~5.5 m per tick
  defaultMaxAgentAge: 2880            # 30 days (longer for realistic seniors)