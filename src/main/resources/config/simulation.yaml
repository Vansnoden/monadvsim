# ======================================================================
# Tokens – environmental layers (unchanged)
# ======================================================================
tokens:
  - token: "temperature"
    layer: "t2m"
  - token: "precipitation"
    layer: "tp"
  - token: "population"
    layer: "Population"
  - token: "building_density"
    layer: "Buildings"
  - token: "elevation"
    layer: "Elevation"

# ======================================================================
# Agent rules – refined with physiological realism
# ======================================================================
agentLayers:
  - name: "Mosquitoes"
    rules:
      # Emergency transitions (if development extremely delayed)
      - condition: "stage == 'LARVA' && age > 960"
        action: "pupate"
        priority: 10
      - condition: "stage == 'PUPA' && age > 384"
        action: "emerge"
        priority: 10
      # Feeding and resting cycle
      - condition: "stage == 'ADULT' && energy < 0.6 && !resting"
        action: "feed"
        priority: 8
      - condition: "stage == 'ADULT' && energy < 0.9 && resting"
        action: "rest"
        priority: 6
      # Gonotrophic cycle – only when energy sufficient
      - condition: "stage == 'ADULT' && energy > 0.7 && !gravid"
        action: "get_gravid"
        priority: 7
      - condition: "gravid == true && temperature > 288.15"  # >15°C
        action: "lay_eggs"
        priority: 6
      # Temperature extremes
      - condition: "temperature < 283.15 || temperature > 313.15"
        action: "die"
        priority: 9
      # Seek shelter if heavy rain or low temperature
      - condition: "(precipitation > 0.008 || temperature < 287.15) && building_density > 0.1 && !resting"
        action: "rest_in_building"
        priority: 5
      # Default movement
      - condition: "stage == 'ADULT' && !resting"
        action: "move_random"
        priority: 3
      - condition: "true"
        action: "rest"
        priority: 2

  - name: "WaterTanks"
    rules:
      - condition: "waterVolume <= 5 && waterVolume > 0"
        action: "dry_out"
        priority: 3
      - condition: "temperature < 273.15 && waterVolume > 0"
        action: "freeze"
        priority: 2
      - condition: "temperature > 288.15 && precipitation < 0.002"
        action: "evaporate"
        priority: 5
      - condition: "waterVolume == 0 && eggCount == 0 && larvalCount == 0"
        action: "die"
        priority: 4

# ======================================================================
# Seeding – habitat-weighted (critical for spatial validity)
# ======================================================================
seeding:
  seedAcrossFullStudySite: False       # Use habitat suitability weighting
  tanksToSeed: 10000
  mosquitoesToSeed: 250000
  habitatGridSizeX: 100
  habitatGridSizeY: 100
  # Low thresholds to include many cells, weighting will select most suitable
  tankBuildingThreshold: 0.0001
  tankPopulationThreshold: 0.0001
  mosquitoBuildingThreshold: 0.0001
  mosquitoPopulationThreshold: 0.0001

# ======================================================================
# Project defaults
# ======================================================================
project:
  defaultAgentSearchRadius: 0.005    # ~550 m
  defaultAgentStep: 0.00005           # ~5.5 m per tick
  defaultMaxAgentAge: 2880            # 30 days (longer for realistic seniors)