# ================================================================
# SIMULATION CONFIGURATION - REVISED FOR ACTIVE POPULATION DYNAMICS
# ================================================================

time:
  startDateTime: "2020-01-01T00:00:00"
  totalTicks: 5000
  tickMinutes: 15

files:
  studySite: "prepared_data/somali/somali.shp"

gridCellSizeDegrees: 0.001

# ================================================================
# SPECIES PARAMETERS - OPTIMIZED FOR EGG DEVELOPMENT
# ================================================================
species:
  egg_dev_rho: 0.005000000000000001
  egg_dev_k: 39.20841161317061
  egg_dev_Delta: 1.9999999999999998
  egg_dev_lambda: -0.854916887158478
  larva_dev_a: 2.7054689312186438e-05
  larva_dev_Tmin: 5.123026541348266
  larva_dev_Tmax: 44.999999999835175
  larva_dev_m: 1.663077023745059
  pupa_dev_rho: 0.005115463305281753
  pupa_dev_k: 39.940257466039114
  pupa_dev_Delta: 1.9999999999999998
  pupa_dev_lambda: -0.9081661833839708
  egg_mort_b1: 3.572876
  egg_mort_b2: -0.323474
  egg_mort_b3: 0.004941
  larva_mort_b1: 1.9999999999999998
  larva_mort_b2: -0.7395036647759831
  larva_mort_b3: 0.017491023810106067
  pupa_mort_b1: 5.882576
  pupa_mort_b2: -0.578528
  pupa_mort_b3: 0.009458
  fecundity_rmax: 1.6021994175985133
  fecundity_Topt: 30.634033187663604
  fecundity_c: -0.0052723551194922445
  adult_mort_b1: -1.4775
  adult_mort_b2: -0.1377
  adult_mort_b3: 0.003908
  adult_mortality_per_day: 0.1198
  sex_ratio: 0.5
  host_carrying_capacity_base: 2.0

# ================================================================
# LAYER DEFINITIONS
# ================================================================
layers:
  - name: Elevation
    filePath: prepared_data/somali/Small_Somali_Elevation_10m.tif
    type: raster

  - name: Buildings
    filePath: prepared_data/somali/Small_Somali_Building_Density_10m.tif
    type: raster

  - name: Population
    filePath: prepared_data/somali/population_2020_1km.tif
    type: raster

  - name: t2m
    filePath: prepared_data/somali/merged_2020_2023.nc
    type: timeseries
    variable: t2m

  - name: tp
    filePath: prepared_data/somali/merged_2020_2023.nc
    type: timeseries
    variable: tp

# ================================================================
# TOKENS FOR RULE ENGINE
# ================================================================
tokens:
  - token: "temperature"
    layer: "t2m"
  - token: "precipitation"
    layer: "tp"
  - token: "population"
    layer: "Population"
  - token: "building_density"
    layer: "Buildings"
  - token: "elevation"
    layer: "Elevation"

# ================================================================
# AGENT LAYERS WITH ENHANCED RULES
# ================================================================
agentLayers:
  - name: "Mosquitoes"
    rules:
      - condition: "stage == 'LARVA' && age > 200 && energy > 0.4"
        action: "pupate"
        priority: 5

      - condition: "stage == 'PUPA' && age > 150"
        action: "emerge"
        priority: 5

      - condition: "stage == 'LARVA' && getTotalLarvae > 15000 && age > 100"
        action: "pupate"
        priority: 6

      - condition: "stage == 'ADULT' && energy < 0.6 && !resting"
        action: "feed"
        priority: 9

      - condition: "stage == 'ADULT' && energy < 0.8 && resting"
        action: "rest"
        priority: 8

      - condition: "stage == 'ADULT' && energy > 0.5 && !gravid"
        action: "get_gravid"
        priority: 8

      - condition: "gravid == true && temperature > 280.15 && getTotalLarvae < 30000"
        action: "lay_eggs"
        priority: 7

      - condition: "temperature < 273.15 || temperature > 318.15"
        action: "die"
        priority: 10

      - condition: "(precipitation > 0.008 || temperature < 285.15) && building_density > 0.1 && !resting"
        action: "rest_in_building"
        priority: 6

      - condition: "stage == 'ADULT' && !resting && age < 2000"
        action: "move_random"
        priority: 3

      - condition: "true"
        action: "rest"
        priority: 2

  - name: "WaterTanks"
    rules:
      - condition: "true"
        action: "evaporate"
        priority: 1

      - condition: "larvalCount > capacity * 0.7 && waterVolume > 0"
        action: "thin_larvae"
        priority: 5

      - condition: "eggCount > 150 && waterVolume > 15"
        action: "hatch_eggs"
        priority: 6

      - condition: "waterVolume <= 5 && waterVolume > 0"
        action: "dry_out"
        priority: 4

      - condition: "temperature < 273.15 && waterVolume > 0"
        action: "freeze"
        priority: 3

      - condition: "waterVolume == 0 && eggCount < 10 && larvalCount < 10"
        action: "die"
        priority: 4

# ================================================================
# InertAgent (Water Tank) Configuration
# ================================================================
inert_agents:
  max_larvae_capacity: 300
  mortality_intensity: 0.4
  min_larvae_retain: 20
  max_water_volume: 100.0
  hatch_fraction_min: 0.1
  hatch_fraction_max: 0.6

# ================================================================
# SEEDING CONFIGURATION
# ================================================================
seeding:
  seedAcrossFullStudySite: false
  useOccurrencePoints: true
  occurrenceFilePath: "prepared_data/ethiopia_occurrence/merged_observations.csv"
  occurrenceYearStart: 2016
  occurrenceYearEnd: 2023
  occurrenceBufferKm: 0.05
  tanksToSeed: 2500
  mosquitoesToSeed: 10000
  habitatGridSizeX: 100
  habitatGridSizeY: 100
  tankBuildingThreshold: 0.000001
  tankPopulationThreshold: 0.000001
  mosquitoBuildingThreshold: 0.0001
  mosquitoPopulationThreshold: 0.0001

# ================================================================
# PROJECT DEFAULTS
# ================================================================
project:
  defaultAgentSearchRadius: 0.005
  defaultAgentStep: 0.00005
  defaultMaxAgentAge: 5760
  maxAgeMultiplierEgg: 0.05
  maxAgeMultiplierLarva: 0.85
  maxAgeMultiplierPupa: 0.15
  maxAgeMultiplierAdult: 0.40