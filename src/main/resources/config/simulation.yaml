# ================================================================
# SIMULATION CONFIGURATION - REVISED FOR STABLE POPULATION DYNAMICS
# ================================================================

time:
  startDateTime: "2020-01-01T00:00:00"
  totalTicks: 3000        
  tickMinutes: 15

files:
  studySite: "prepared_data/somali/somali.shp"

gridCellSizeDegrees: 0.001

# ================================================================
# SPECIES PARAMETERS - REVISED FOR REALISTIC DEVELOPMENT
# ================================================================
species:
  # ==============================================================
  # EGG DEVELOPMENT (exponential)
  # ==============================================================
  egg_dev_rho: 0.005000000000000001
  egg_dev_k: 39.20841161317061
  egg_dev_Delta: 1.9999999999999998
  egg_dev_lambda: -0.854916887158478

  # ==============================================================
  # LARVA DEVELOPMENT (Brière) - SIGNIFICANTLY INCREASED
  # ==============================================================
  larva_dev_a: 1.0e-4                    # WAS: 2.7e-5 (3.7x faster)
  larva_dev_Tmin: 5.123026541348266
  larva_dev_Tmax: 44.999999999835175
  larva_dev_m: 1.663077023745059

  # ==============================================================
  # PUPA DEVELOPMENT (exponential) - INCREASED
  # ==============================================================
  pupa_dev_rho: 0.015                    # WAS: 0.0051 (3x faster)
  pupa_dev_k: 39.940257466039114
  pupa_dev_Delta: 1.9999999999999998
  pupa_dev_lambda: -0.9081661833839708

  # ==============================================================
  # MORTALITY RATES - REDUCED FOR BETTER SURVIVAL
  # ==============================================================
  egg_mort_b1: 2.0                       # WAS: 3.57 (lower mortality)
  egg_mort_b2: -0.20                     # WAS: -0.323
  egg_mort_b3: 0.0035                    # WAS: 0.00494

  larva_mort_b1: 1.5                     # WAS: 2.0 (lower mortality)
  larva_mort_b2: -0.60                   # WAS: -0.739
  larva_mort_b3: 0.014                   # WAS: 0.01749

  pupa_mort_b1: 4.5                      # WAS: 5.88 (lower mortality)
  pupa_mort_b2: -0.45                    # WAS: -0.578
  pupa_mort_b3: 0.0075                   # WAS: 0.009458

  # ==============================================================
  # FECUNDITY - INCREASED EGG PRODUCTION
  # ==============================================================
  fecundity_rmax: 2.8                    # WAS: 1.602 (more eggs)
  fecundity_Topt: 30.634033187663604
  fecundity_c: -0.0052723551194922445

  # ==============================================================
  # ADULT MORTALITY - DRAMATICALLY REDUCED
  # ==============================================================
  adult_mort_b1: -3.5                    # WAS: -1.4775 (much lower)
  adult_mort_b2: -0.10                   # WAS: -0.1377
  adult_mort_b3: 0.0030                  # WAS: 0.003908
  adult_mortality_per_day: 0.04          # WAS: 0.1198 (25 days lifespan)
  
  # ==============================================================
  # SEX RATIO
  # ==============================================================
  sex_ratio: 0.5

  # ==============================================================
  # HOST CARRYING CAPACITY
  # ==============================================================
  host_carrying_capacity_base: 5.0       # WAS: 1.0 (more egg capacity)

# ================================================================
# LAYER DEFINITIONS
# ================================================================
layers:
  - name: Elevation
    filePath: prepared_data/somali/Small_Somali_Elevation_10m.tif
    type: raster
    
  - name: Buildings
    filePath: prepared_data/somali/Small_Somali_Building_Density_10m.tif
    type: raster
    
  - name: Population
    filePath: prepared_data/somali/population_2020_1km.tif
    type: raster
  
  - name: t2m
    filePath: prepared_data/somali/merged_2020_2023.nc
    type: timeseries
    variable: t2m
  
  - name: tp
    filePath: prepared_data/somali/merged_2020_2023.nc
    type: timeseries
    variable: tp

# ================================================================
# TOKENS FOR RULE ENGINE
# ================================================================
tokens:
  - token: "temperature"
    layer: "t2m"
  - token: "precipitation"
    layer: "tp"
  - token: "population"
    layer: "Population"
  - token: "building_density"
    layer: "Buildings"
  - token: "elevation"
    layer: "Elevation"

# ================================================================
# AGENT LAYERS WITH REVISED RULES
# ================================================================
agentLayers:
  - name: "Mosquitoes"
    rules:
      # ==============================================================
      # DEVELOPMENT TRANSITIONS (Emergency fallbacks only)
      # ==============================================================
      
      # Larva → Pupa: Emergency if automatic development fails
      - condition: "stage == 'LARVA' && age > 384 && energy > 0.5"
        action: "pupate"
        priority: 5
        
      # Pupa → Adult: Emergency if automatic development fails
      - condition: "stage == 'PUPA' && age > 384"
        action: "emerge"
        priority: 5
      
      # ==============================================================
      # FEEDING - More aggressive
      # ==============================================================
      - condition: "stage == 'ADULT' && energy < 0.5 && !resting"
        action: "feed"
        priority: 9
        
      - condition: "stage == 'ADULT' && energy < 0.7 && resting"
        action: "rest"
        priority: 7
      
      # ==============================================================
      # REPRODUCTION - Much more aggressive
      # ==============================================================
      
      # Get gravid as soon as energy is sufficient
      - condition: "stage == 'ADULT' && energy > 0.5 && !gravid"
        action: "get_gravid"
        priority: 8
      
      # Lay eggs ASAP when gravid (lower temperature threshold)
      - condition: "gravid == true && temperature > 278.15"
        action: "lay_eggs"
        priority: 7
      
      # ==============================================================
      # TEMPERATURE EXTREMES
      # ==============================================================
      - condition: "temperature < 273.15 || temperature > 318.15"
        action: "die"
        priority: 10
      
      # ==============================================================
      # SHELTER SEEKING
      # ==============================================================
      - condition: "(precipitation > 0.008 || temperature < 285.15) && building_density > 0.1 && !resting"
        action: "rest_in_building"
        priority: 6
      
      # ==============================================================
      # MOVEMENT
      # ==============================================================
      - condition: "stage == 'ADULT' && !resting"
        action: "move_random"
        priority: 3
      
      # ==============================================================
      # DEFAULT: Rest to avoid exhaustion
      # ==============================================================
      - condition: "true"
        action: "rest"
        priority: 2

  - name: "WaterTanks"
    rules:
      - condition: "true"
        action: "evaporate"
        priority: 1
      - condition: "waterVolume <= 5 && waterVolume > 0"
        action: "dry_out"
        priority: 3
      - condition: "temperature < 273.15 && waterVolume > 0"
        action: "freeze"
        priority: 2
      - condition: "waterVolume == 0 && eggCount == 0 && larvalCount == 0"
        action: "die"
        priority: 4

# ================================================================
# SEEDING CONFIGURATION
# ================================================================
seeding:
  seedAcrossFullStudySite: false
  useOccurrencePoints: true
  occurrenceFilePath: "prepared_data/ethiopia_occurrence/merged_observations.csv" 
  occurrenceYearStart: 2016      
  occurrenceYearEnd: 2023
  occurrenceBufferKm: 0.05
  tanksToSeed: 1000                     # WAS: 500 (more breeding sites)
  mosquitoesToSeed: 2000                # WAS: 1000 (more initial adults)
  habitatGridSizeX: 100
  habitatGridSizeY: 100
  tankBuildingThreshold: 0.000001       # WAS: 0.00001 (even more permissive)
  tankPopulationThreshold: 0.000001     # WAS: 0.00001 (even more permissive)
  mosquitoBuildingThreshold: 0.0001
  mosquitoPopulationThreshold: 0.0001

# ================================================================
# PROJECT DEFAULTS
# ================================================================
project:
  defaultAgentSearchRadius: 0.005
  defaultAgentStep: 0.00005
  defaultMaxAgentAge: 2880
  # Stage-specific max age multipliers
  maxAgeMultiplierEgg: 0.05      # 5% = 144 ticks (36 hours)
  maxAgeMultiplierLarva: 0.45    # 45% = 1296 ticks (13.5 days) 
  maxAgeMultiplierPupa: 0.15     # 15% = 432 ticks (4.5 days)
  maxAgeMultiplierAdult: 0.35    # 35% = 1008 ticks (10.5 days)